name: Eta Build

on:
  push:
    branches:
      - main
    tags:
      - "v*.znmlr.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apks:
    name: 构建 Debug 与 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置 JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: 配置 Android SDK 工具
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: 安装 Android SDK 37
        run: sdkmanager --channel=3 "platforms;android-37.0"

      - name: 验证下游标签格式
        if: github.ref_type == 'tag'
        env:
          ETA_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$ETA_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.znmlr\.[1-9][0-9]*$ ]]; then
            echo "::error::标签必须符合 v<上游版本>.znmlr.<正整数序号>。"
            exit 1
          fi

      - name: 运行完整单元测试
        run: >-
          timeout --signal=TERM --kill-after=30s 15m
          ./gradlew --no-daemon --no-configuration-cache
          :app:testDebugUnitTest

      - name: 运行 Android Lint
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :app:lint

      - name: 还原发布证书
        env:
          ETA_RELEASE_KEYSTORE_BASE64: ${{ secrets.ETA_RELEASE_KEYSTORE_BASE64 }}
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$ETA_RELEASE_KEYSTORE_BASE64" ||
                -z "$ETA_RELEASE_STORE_PASSWORD" ||
                -z "$ETA_RELEASE_KEY_ALIAS" ||
                -z "$ETA_RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::缺少 Release 签名 Secrets，请检查仓库的 Actions Secrets。"
            exit 1
          fi
          printf '%s' "$ETA_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/eta-release.jks"

      - name: 构建 Debug 与 Release APK
        env:
          ETA_RELEASE_STORE_FILE: ${{ runner.temp }}/eta-release.jks
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :app:assembleDebug :app:assembleRelease

      - name: 验证并整理 APK
        id: apk
        env:
          ETA_EVENT_REF_TYPE: ${{ github.ref_type }}
          ETA_EVENT_REF_NAME: ${{ github.ref_name }}
        run: |
          debug_apk="app/build/outputs/apk/debug/app-debug.apk"
          release_apk="app/build/outputs/apk/release/app-release.apk"
          debug_metadata="app/build/outputs/apk/debug/output-metadata.json"
          release_metadata="app/build/outputs/apk/release/output-metadata.json"
          output_dir="$RUNNER_TEMP/apks"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"
          apkanalyzer_path="$(command -v apkanalyzer || true)"

          if [[ -z "$apkanalyzer_path" ]]; then
            apkanalyzer_path="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name apkanalyzer | sort -V | tail -n 1)"
          fi

          if [[ ! -f "$debug_apk" ]]; then
            echo "::error::未找到 Debug APK。"
            exit 1
          fi
          if [[ ! -f "$release_apk" ]]; then
            echo "::error::未找到 Release APK。"
            exit 1
          fi
          if [[ ! -f "$debug_metadata" || ! -f "$release_metadata" ]]; then
            echo "::error::未找到 Gradle APK 输出元数据。"
            exit 1
          fi
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::未找到 apksigner。"
            exit 1
          fi
          if [[ -z "$apkanalyzer_path" ]]; then
            echo "::error::未找到 apkanalyzer。"
            exit 1
          fi

          read_gradle_version_name() {
            python3 - "$1" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as metadata_file:
              metadata = json.load(metadata_file)

          versions = {
              element.get("versionName")
              for element in metadata.get("elements", [])
              if element.get("versionName")
          }
          if len(versions) != 1:
              raise SystemExit("APK 输出元数据中必须且只能包含一个 versionName")
          print(versions.pop())
          PY
          }

          debug_gradle_version="$(read_gradle_version_name "$debug_metadata")"
          release_gradle_version="$(read_gradle_version_name "$release_metadata")"
          debug_apk_version="$("$apkanalyzer_path" manifest version-name "$debug_apk" | tr -d '\r\n')"
          release_apk_version="$("$apkanalyzer_path" manifest version-name "$release_apk" | tr -d '\r\n')"

          version_name="$release_gradle_version"
          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.znmlr\.[1-9][0-9]*$ ]]; then
            echo "::error::versionName 不符合 <上游版本>.znmlr.<正整数序号>：$version_name"
            exit 1
          fi
          if [[ "$debug_gradle_version" != "$version_name" ||
                "$debug_apk_version" != "$version_name" ||
                "$release_apk_version" != "$version_name" ]]; then
            echo "::error::Debug、Release APK 与 Gradle 输出元数据的 versionName 不一致。"
            exit 1
          fi
          if [[ "$ETA_EVENT_REF_TYPE" == "tag" &&
                "$ETA_EVENT_REF_NAME" != "v$version_name" ]]; then
            echo "::error::标签 $ETA_EVENT_REF_NAME 必须严格等于 v$version_name。"
            exit 1
          fi

          "$apksigner_path" verify "$release_apk"
          mkdir -p "$output_dir"
          debug_name="Eta-v${version_name}-debug.apk"
          release_name="Eta-v${version_name}-release.apk"
          cp "$debug_apk" "$output_dir/$debug_name"
          cp "$release_apk" "$output_dir/$release_name"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "debug_name=$debug_name" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "debug_path=$output_dir/$debug_name" >> "$GITHUB_OUTPUT"
          echo "release_path=$output_dir/$release_name" >> "$GITHUB_OUTPUT"

      - name: 上传 Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.apk.outputs.debug_name }}
          path: ${{ steps.apk.outputs.debug_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: 上传 Release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.apk.outputs.release_name }}
          path: ${{ steps.apk.outputs.release_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14
